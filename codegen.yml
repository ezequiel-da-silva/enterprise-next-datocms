# Atalho: schema + operações GraphQL.
# Uso: set -a && . ./.env && set +a && npm run codegen
#
# Configs:
# - codegen-schema.yml  → src/infra/datocms/generated/schema.types.ts
# - codegen-operations.yml → src/infra/datocms/generated/operations.types.ts
#   (documentos em src/infra/datocms/graphql/*.graphql)
# Schema e operações enviam X-Environment: ${DATOCMS_ENVIRONMENT} (mesmo sandbox que o CDA).
