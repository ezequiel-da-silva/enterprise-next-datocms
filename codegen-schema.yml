schema:
  - https://graphql.datocms.com/:
      headers:
        Authorization: Bearer ${DATOCMS_API_TOKEN}
        X-Environment: ${DATOCMS_ENVIRONMENT}
generates:
  src/infra/datocms/generated/schema.types.ts:
    plugins:
      - typescript
    config:
      enumsAsTypes: true
      skipTypename: false
      scalars:
        BooleanType: boolean
        CustomData: Record<string, unknown>
        DateTime: string
        FloatType: number
        IntType: number
        ItemId: string
        JsonField: unknown
        MetaTagAttributes: Record<string, string>
        UploadId: string
