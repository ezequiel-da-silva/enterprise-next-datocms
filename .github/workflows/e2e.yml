name: E2E smoke

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--with-deps` hits dl.google.com APT; that mirror sometimes serves a
      # half-updated Packages.gz ("File has unexpected size") and exits 100.
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "::warning::Playwright Chromium install failed (attempt ${attempt}/3)"
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Playwright Chromium install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      # Fake account values: e2e/account.spec.ts only renders the signed-out page and never
      # follows the Shopify sign-in link, so no real store credentials are needed.
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_DATOCMS_BASE_EDITING_URL: https://boilerplate-dato.admin.datocms.com
          DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
          SHOPIFY_CART_ENABLED: "1"
          SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: e2e-client
          SHOPIFY_CUSTOMER_SESSION_SECRET: e2e-session-secret-at-least-32-characters

      - name: Playwright smoke
        run: npm run test:e2e
        env:
          DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
          DATOCMS_PREVIEW_SECRET: ${{ secrets.DATOCMS_PREVIEW_SECRET }}
          NEXT_PUBLIC_DATOCMS_BASE_EDITING_URL: https://boilerplate-dato.admin.datocms.com
          SHOPIFY_CART_ENABLED: "1"
          SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: e2e-client
          SHOPIFY_CUSTOMER_SESSION_SECRET: e2e-session-secret-at-least-32-characters
