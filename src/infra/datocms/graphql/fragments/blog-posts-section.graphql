# Fragmento do bloco Blog posts section (`blog_posts_section`).
#
# CMS (obrigatório antes de ativar na query):
#   Schema → Page → Modular content (`contentPage`) → blocos permitidos
#   → incluir **Blog posts section**.
# Depois: `#import` + `... on BlogPostsSectionRecord` em `page-by-slug.graphql`,
# `${BLOG_POSTS_SECTION_BLOCK}` em `queries.ts`, e `npm run codegen`.
#
# `allPosts` / `allCategories` no modo auto NÃO entram neste fragmento —
# o CDA não aninha colecções globais num record. Fetch via `GET_ALL_POSTS`
# e `GET_ALL_CATEGORIES` no RSC.
#import "./post-card.graphql"

fragment BlogPostsSectionBlockFragment on BlogPostsSectionRecord {
  id
  title
  subtitle
  fetchMode
  allCategoriesLabel
  categoryDisplay
  showSortTabs
  hasLimit
  limit
  sectionId
  selectedCategories {
    id
    categoryName
    categorySlug
    categoryColor {
      hex
    }
  }
  manualPosts {
    ...PostCardFields
  }
}
