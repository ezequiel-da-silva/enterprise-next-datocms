# Fragmento do bloco CTA Banner — incluir em `page-by-slug.graphql` (blocks union).
#import "./text-header.graphql"

fragment CtaBannerBlockFields on CtaBannerRecord {
  id
  textHeaderSection {
    ...TextHeaderBlockFragment
  }
  hasEyebrow
  eyebrow
  advancedOptions
  variant
  bgTheme
  hasImage
  buttons {
    __typename
    id
    ctaLabel
    typeContent
    externalLink
    openInNewTab
    ctaLinkAria
    internalLinkPage {
      __typename
      slug
    }
    internalLinkPost {
      __typename
      postSlug
    }
    internalLinkCategory {
      __typename
      categorySlug
    }
    internalLinkAuthor {
      __typename
      authorSlug
    }
  }
  imageBanner {
    id
    asset {
      url
      alt
      width
      height
      blurUpThumb
    }
    assetDesktop {
      url
      alt
      width
      height
      blurUpThumb
    }
  }
}
