# Fragmento do bloco CTA Banner — incluir em `page-by-slug.graphql` (blocks union).
fragment CtaBannerBlockFields on CtaBannerRecord {
  id
  title
  hasEyebrow
  eyebrow
  hasDescription
  description
  advancedOptions
  variant
  bgTheme
  sectionId
  hasImage
  buttons {
    __typename
    id
    ctaLabel
    typeContent
    externalLink
    openInNewTab
    ctaLinkAria
    internalLinkPage {
      __typename
      slug
    }
    internalLinkPost {
      __typename
      postSlug
    }
    internalLinkCategory {
      __typename
      categorySlug
    }
    internalLinkAuthor {
      __typename
      authorSlug
    }
  }
  imageBanner {
    id
    asset {
      url
      alt
      width
      height
    }
    assetDesktop {
      url
      alt
      width
      height
    }
  }
}
