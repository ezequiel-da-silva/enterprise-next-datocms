# Fragmento do bloco Steps Section (`steps_section`).
#
# CMS (obrigatório antes de ativar na query):
#   Schema → Page → Structured text → blocos permitidos → incluir **Steps Section**.
# Depois: `#import` + `... on StepsSectionRecord` em `page-by-slug.graphql`,
# `${STEPS_SECTION_BLOCK}` em `queries.ts`, e `npm run codegen`.
#import "./text-header.graphql"

fragment StepsSectionBlockFragment on StepsSectionRecord {
  id
  textHeaderSection {
    ...TextHeaderBlockFragment
  }
  steps {
    __typename
    ... on StepCardRecord {
      id
      title
      hasDescription
      description
      hasImage
      mediaImage {
        __typename
        ... on ImageBlockRecord {
          id
          asset {
            url
            alt
            width
            height
            blurUpThumb
          }
          assetDesktop {
            url
            alt
            width
            height
            blurUpThumb
          }
        }
      }
    }
  }
}
