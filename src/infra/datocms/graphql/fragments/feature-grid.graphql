# Fragmento do bloco Feature GRID (`feature_grid`).
#
# CMS:
#   Page → Structured text → blocos permitidos → Feature GRID.
# Variantes: `cards` e `full_bleed`.
#import "./carousel-setting.graphql"
#import "./text-header.graphql"
#import "./specialized-image-blocks.graphql"

fragment FeatureGridBlockFragment on FeatureGridRecord {
  id
  textHeaderSection {
    ...TextHeaderBlockFragment
  }
  advancedOptions
  variant
  carouselOptions {
    ...CarouselSettingBlockFragment
  }
  itemsFeatureGrid {
    __typename
    ... on CardRecord {
      id
      titleCard
      hasIcon
      iconCard
      hasDescription
      descriptionCard
      hasImage
      imageCard {
        ...CardImageBlockFields
      }
      hasLink
      linkCard {
        __typename
        ... on LinkRecord {
          id
          ctaLabel
          typeContent
          externalLink
          openInNewTab
          ctaLinkAria
          internalLinkPage {
            __typename
            slug
          }
          internalLinkPost {
            __typename
            postSlug
          }
          internalLinkCategory {
            __typename
            categorySlug
          }
          internalLinkAuthor {
            __typename
            authorSlug
          }
        }
      }
    }
  }
}
