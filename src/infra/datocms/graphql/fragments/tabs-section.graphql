# Fragmento do bloco Tabs Section (`tabs_section`).
#
# CMS (obrigatório antes de ativar na query):
#   Schema → Page → Structured text → blocos permitidos → incluir **Tabs Section**.
# Depois: `#import` + `... on TabsSectionRecord` em `page-by-slug.graphql`,
# `${TABS_SECTION_BLOCK}` em `queries.ts`, e `npm run codegen`.
#import "./text-header.graphql"
#import "./specialized-image-blocks.graphql"

fragment TabsSectionBlockFragment on TabsSectionRecord {
  id
  textHeaderSection {
    ...TextHeaderBlockFragment
  }
  tabs {
    __typename
    ... on TabItemRecord {
      id
      labelTab
      title
      hasDescription
      description
      hasLink
      hasImage
      ctaLink {
        __typename
        ... on LinkRecord {
          id
          ctaLabel
          typeContent
          externalLink
          openInNewTab
          ctaLinkAria
          internalLinkPage {
            __typename
            slug
          }
          internalLinkPost {
            __typename
            postSlug
          }
          internalLinkCategory {
            __typename
            categorySlug
          }
          internalLinkAuthor {
            __typename
            authorSlug
          }
        }
      }
      mediaImage {
        ...CardImageBlockFields
      }
    }
  }
}
