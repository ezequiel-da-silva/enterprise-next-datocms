# Campos de cartão do modelo Post (`post`).
# Runtime: `POST_CARD_FIELDS` em `queries.ts`.
#import "./specialized-image-blocks.graphql"

fragment PostCardFields on PostRecord {
  id
  _firstPublishedAt
  _updatedAt
  postTitle
  postSlug
  excerpt
  postAuthor {
    authorName
  }
  postCategory {
    id
    categoryName
    categorySlug
    categoryColor {
      hex
    }
  }
  coverImage {
    ...CardImageBlockFields
  }
}
