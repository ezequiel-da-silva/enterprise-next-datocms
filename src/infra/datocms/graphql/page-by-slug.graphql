#import "./fragments/cta-banner.graphql"
#import "./fragments/logo-grid.graphql"
#import "./fragments/reviews-section.graphql"
#import "./fragments/pricing-section.graphql"
#import "./fragments/stats-section.graphql"
#import "./fragments/steps-section.graphql"
#import "./fragments/tabs-section.graphql"
#import "./fragments/feature-grid.graphql"
#import "./fragments/team-section.graphql"

query PageBySlug($slug: String!, $locale: SiteLocale!) {
  page(locale: $locale, fallbackLocales: [en, pt_BR, es], filter: { slug: { eq: $slug } }) {
    id
    title
    slug
    heroPage {
      __typename
      ... on HeroSectionRecord {
        id
        layoutHero
        titleHero
        subtitleHero {
          value
          blocks
          links
          inlineBlocks
        }
        showButton
        buttonHero {
          __typename
          id
          ctaLabel
          typeContent
          externalLink
          openInNewTab
          ctaLinkAria
          internalLinkPage {
            __typename
            slug
          }
          internalLinkPost {
            __typename
            postSlug
          }
          internalLinkCategory {
            __typename
            categorySlug
          }
          internalLinkAuthor {
            __typename
            authorSlug
          }
        }
        showImageHero
        imageHero {
          id
          asset {
            url
            alt
            width
            height
            blurUpThumb
          }
          assetDesktop {
            url
            alt
            width
            height
            blurUpThumb
          }
        }
        showImageOverlay
        imageOverlay {
          id
          asset {
            url
            alt
            width
            height
            blurUpThumb
          }
          assetDesktop {
            url
            alt
            width
            height
            blurUpThumb
          }
        }
      }
    }
    structuredText {
      value
      links {
        __typename
        ... on PageRecord {
          id
          title
          slug
        }
      }
      blocks {
        __typename
        ... on RecordInterface {
          id
        }
        ... on ImageBlockRecord {
          id
          asset {
            url
            alt
            width
            height
            blurUpThumb
          }
          assetDesktop {
            url
            alt
            width
            height
            blurUpThumb
          }
        }
        ... on ImageGalleryBlockRecord {
          id
          assets {
            url
            alt
            width
            height
            blurUpThumb
          }
        }
        ... on VideoBlockRecord {
          id
          _editingUrl
          asset {
            url
            title
            width
            height
            # Dato blocks the raw asset URL ("Serving raw videos is disabled"): use Mux.
            video {
              muxPlaybackId
              streamingUrl
              mp4Url(res: high)
              # width limitado: o poster nativo (ex. 2732px) desperdiça bytes e atrasa o CLS.
              thumbnailUrl(width: 640)
              width
              height
              duration
            }
          }
          # CMS: add file field `captions` on video_block, then:
          # captions { url title }
        }
        ... on FeatureGridRecord {
          ...FeatureGridBlockFragment
        }
        ... on FaqGroupRecord {
          id
          title
          subtitle
          hasSubtitle
          advancedOptions
          accordionMode
          openFirstItem
          enableFaqSchema
          headerAlignment
          questions {
            id
            question {
              value
            }
            answer {
              value
            }
          }
        }
        ... on CtaBannerRecord {
          ...CtaBannerBlockFields
        }
        ... on LogoGridRecord {
          ...LogoGridBlockFragment
        }
        ... on ReviewsSectionRecord {
          ...ReviewsSectionBlockFragment
        }
        ... on PricingSectionRecord {
          ...PricingSectionBlockFragment
        }
        ... on StatsSectionRecord {
          ...StatsSectionBlockFragment
        }
        ... on StepsSectionRecord {
          ...StepsSectionBlockFragment
        }
        ... on TabsSectionRecord {
          ...TabsSectionBlockFragment
        }
        ... on TeamSectionRecord {
          ...TeamSectionBlockFragment
        }
      }
      inlineBlocks
    }
    seoSettingsSocial {
      title
      description
      twitterCard
      noIndex
      image {
        url
        alt
        width
        height
      }
    }
    _seoMetaTags {
      tag
      attributes
      content
    }
    _allSlugLocales {
      locale
      value
    }
  }
  _site {
    faviconMetaTags {
      tag
      attributes
      content
    }
  }
}
