query ListProductPages($locale: SiteLocale!) {
  allProductPages(locale: $locale, fallbackLocales: [en, pt_BR, es], first: 200, orderBy: _updatedAt_DESC) {
    title
    shopifyHandle
    badge
    profile
    terrain
    flex
    baseImage {
      url
      alt
      width
      height
    }
  }
}
