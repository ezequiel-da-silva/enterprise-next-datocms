query SearchCatalog($q: String!, $locale: SiteLocale!) {
  products: allProductPages(
    locale: $locale
    first: 10
    filter: {
      OR: [
        { title: { matches: { pattern: $q, regexp: false, caseSensitive: false } } }
        { shopifyHandle: { eq: $q } }
      ]
    }
    orderBy: _updatedAt_DESC
  ) {
    id
    title
    shopifyHandle
  }
  collections: allCollectionPages(
    locale: $locale
    first: 10
    filter: {
      OR: [
        { title: { matches: { pattern: $q, regexp: false, caseSensitive: false } } }
        { shopifyHandle: { eq: $q } }
      ]
    }
    orderBy: _updatedAt_DESC
  ) {
    id
    title
    shopifyHandle
  }
}
