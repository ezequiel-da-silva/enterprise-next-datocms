query ProductPageByHandle($handle: String!, $locale: SiteLocale!) {
  productPage(
    locale: $locale
    fallbackLocales: [en, pt_BR, es]
    filter: { shopifyHandle: { eq: $handle } }
  ) {
    id
    title
    shopifyHandle
    shopifyProductId
    _seoMetaTags {
      attributes
      content
      tag
    }
  }
  _site {
    faviconMetaTags {
      attributes
      content
      tag
    }
  }
}
