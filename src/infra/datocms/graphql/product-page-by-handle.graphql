query ProductPageByHandle($handle: String!, $locale: SiteLocale!, $withEditingUrl: Boolean!) {
  productPage(
    locale: $locale
    fallbackLocales: [en, pt_BR, es]
    filter: { shopifyHandle: { eq: $handle } }
  ) {
    id
    title
    description
    profile
    flex
    terrain
    riderLevel
    coreMaterial
    badge
    baseImage {
      url
      alt
      width
      height
    }
    sizeChart
    reviews {
      id
      authorName
      rating
      title
      comment
      verifiedRider
      date
      _editingUrl @include(if: $withEditingUrl)
    }
    seo {
      title
      description
      twitterCard
      noIndex
      image {
        url
        alt
        width
        height
      }
    }
    shopifyHandle
    shopifyProductId
    _editingUrl @include(if: $withEditingUrl)
    _seoMetaTags {
      attributes
      content
      tag
    }
  }
  _site {
    faviconMetaTags {
      attributes
      content
      tag
    }
  }
}
