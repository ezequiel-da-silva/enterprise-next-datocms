schema:
  - https://graphql.datocms.com/:
      headers:
        Authorization: Bearer ${DATOCMS_API_TOKEN}
documents:
  - "src/infra/datocms/graphql/**/*.graphql"
generates:
  src/infra/datocms/generated/operations.types.ts:
    plugins:
      - typescript-operations
    config:
      enumsAsTypes: true
      skipTypename: false
      preResolveTypes: true
      importSchemaTypesFrom: "./schema.types"
      scalars:
        BooleanType: boolean
        CustomData: Record<string, unknown>
        DateTime: string
        FloatType: number
        IntType: number
        ItemId: string
        JsonField: unknown
        MetaTagAttributes: Record<string, string>
        UploadId: string
      avoidOptionals:
        field: true
        object: false
        inputValue: false
